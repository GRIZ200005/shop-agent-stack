# Aster local-only P0 configuration; credentials are required environment variables.
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/aster?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: aster
    password: ${ASTER_DB_PASSWORD}
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 10
      stat-view-servlet:
        enabled: false
  data:
    redis:
      host: redis
      port: 6379
      database: 0
      timeout: 2s
    mongodb:
      host: mongo
      port: 27017
      database: aster
  rabbitmq:
    host: rabbitmq
    port: 5672
    virtual-host: /aster
    username: aster
    password: ${ASTER_MQ_PASSWORD}
logging:
  config: file:/config/logback-p0.xml
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
mongo:
  insert:
    sqlEnable: false
minio:
  endpoint: http://localhost:9000
  bucketName: aster
  accessKey: unused-in-p0
  secretKey: unused-in-p0
alipay:
  gatewayUrl: http://127.0.0.1:1/disabled
  appId: disabled
  appPrivateKey: ''
  alipayPublicKey: ''
  returnUrl: ''
  notifyUrl: ''
