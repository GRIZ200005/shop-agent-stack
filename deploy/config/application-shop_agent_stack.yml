# ShopAgentStack local development configuration; credentials are required environment variables.
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/shop_agent_stack?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: shop_agent_stack
    password: ${SHOP_AGENT_STACK_DB_PASSWORD}
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 10
      stat-view-servlet:
        enabled: false
  data:
    redis:
      host: redis
      port: 6379
      database: 0
      timeout: 2s
    mongodb:
      host: mongo
      port: 27017
      database: shop_agent_stack
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    host: rabbitmq
    port: 5672
    virtual-host: /shop_agent_stack
    username: shop_agent_stack
    password: ${SHOP_AGENT_STACK_MQ_PASSWORD}
logging:
  config: file:/config/logback-p0.xml
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
mongo:
  insert:
    sqlEnable: false
minio:
  endpoint: http://localhost:9000
  bucketName: shop_agent_stack
  accessKey: unused-in-p0
  secretKey: unused-in-p0
alipay:
  gatewayUrl: http://127.0.0.1:1/disabled
  appId: disabled
  appPrivateKey: ''
  alipayPublicKey: ''
  returnUrl: ''
  notifyUrl: ''
