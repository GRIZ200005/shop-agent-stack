services:
  web:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:18030:80"]
    volumes:
      - ../apps/web/dist:/usr/share/nginx/html:ro
      - ./nginx/aster.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      portal: {condition: service_healthy}
      admin: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
