services:
  commerce-mcp:
    image: shop_agent_stack-agent:p2
    build: ../services/agent
    command: ["uvicorn","shop_agent_stack.mcp_server:app","--host","0.0.0.0","--port","8011","--no-access-log"]
    environment:
      SHOP_AGENT_STACK_PORTAL_URL: http://portal:8085
      SHOP_AGENT_STACK_RETRIEVAL_MODE: ${SHOP_AGENT_STACK_RETRIEVAL_MODE:-hybrid}
    volumes:
      - ../.local/policy-index.key:/run/secrets/index_key:ro
    depends_on:
      portal: {condition: service_healthy}
  agent:
    image: shop_agent_stack-agent:p2
    build: ../services/agent
    environment:
      SHOP_AGENT_STACK_PORTAL_URL: http://portal:8085
      SHOP_AGENT_STACK_MCP_URL: http://commerce-mcp:8011/mcp
      SHOP_AGENT_STACK_ENABLE_TEST_PROVIDER: "false"
      SHOP_AGENT_STACK_DEEPSEEK_API_KEY: ${SHOP_AGENT_STACK_DEEPSEEK_API_KEY:-}
      SHOP_AGENT_STACK_DEEPSEEK_MODEL: ${SHOP_AGENT_STACK_DEEPSEEK_MODEL:-}
      SHOP_AGENT_STACK_DEEPSEEK_BASE_URL: ${SHOP_AGENT_STACK_DEEPSEEK_BASE_URL:-}
      SHOP_AGENT_STACK_OPENAI_API_KEY: ${SHOP_AGENT_STACK_OPENAI_API_KEY:-}
      SHOP_AGENT_STACK_OPENAI_MODEL: ${SHOP_AGENT_STACK_OPENAI_MODEL:-}
      SHOP_AGENT_STACK_OPENAI_BASE_URL: ${SHOP_AGENT_STACK_OPENAI_BASE_URL:-}
      SHOP_AGENT_STACK_KIMI_API_KEY: ${SHOP_AGENT_STACK_KIMI_API_KEY:-}
      SHOP_AGENT_STACK_KIMI_MODEL: ${SHOP_AGENT_STACK_KIMI_MODEL:-}
      SHOP_AGENT_STACK_KIMI_BASE_URL: ${SHOP_AGENT_STACK_KIMI_BASE_URL:-}
      SHOP_AGENT_STACK_CUSTOM_API_KEY: ${SHOP_AGENT_STACK_CUSTOM_API_KEY:-}
      SHOP_AGENT_STACK_CUSTOM_MODEL: ${SHOP_AGENT_STACK_CUSTOM_MODEL:-}
      SHOP_AGENT_STACK_CUSTOM_BASE_URL: ${SHOP_AGENT_STACK_CUSTOM_BASE_URL:-}
    volumes:
      - agent_data:/data
      - ../.local/agent-encryption.key:/run/secrets/agent_key:ro
    depends_on:
      commerce-mcp: {condition: service_started}
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    volumes:
      - ./nginx/shop_agent_stack-p2.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      agent: {condition: service_healthy}
volumes:
  agent_data:
