name: shop_agent_stack-retrieval
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command: etcd --advertise-client-urls=http://etcd:2379 --listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes: ["etcd:/etcd"]
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: minio server /data
    volumes: ["minio:/data"]
  milvus:
    image: milvusdb/milvus:v2.6.15
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes: ["milvus:/var/lib/milvus"]
    ports: ["127.0.0.1:19530:19530"]
    depends_on: [etcd, minio]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 5s
      timeout: 3s
      retries: 40
  evaluation:
    profiles: ["evaluation"]
    build:
      context: ../services/retrieval
    image: shop_agent_stack-retrieval:eval
    environment:
      MILVUS_URI: http://milvus:19530
      HF_HOME: /models
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
    volumes:
      - ../:/workspace
      - models:/models
    working_dir: /workspace
    command: ["python", "scripts/evaluate-retrieval-matrix.py"]
    depends_on:
      milvus: {condition: service_healthy}
volumes:
  etcd:
  minio:
  milvus:
  models:
